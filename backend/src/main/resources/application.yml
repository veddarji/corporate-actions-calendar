spring:
  application:
    name: corporate-actions-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/corporate_actions_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: 300000
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASS:admin}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-that-is-at-least-256-bits-long-for-hs256}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:86400000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:2592000000}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  rate-limit:
    auth-requests-per-minute: 10
    api-requests-per-minute: 100

data:
  ingestion:
    corporate-actions:
      interval: PT15M
    financial-results:
      interval: PT1H
  reconciliation:
    interval: P1D

nse:
  base-url: ${NSE_BASE_URL:https://www.nseindia.com}
  corporate-actions-url: ${NSE_CA_URL:https://www.nseindia.com/api/corporates-corporateActions}
  financial-results-url: ${NSE_FR_URL:https://www.nseindia.com/api/corporates-financial-results}
  request-timeout-ms: 30000
  user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36

yahoo:
  finance:
    base-url: ${YAHOO_BASE_URL:https://query1.finance.yahoo.com}
    request-timeout-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
    mail:
      enabled: false
  security:
    enabled: true

logging:
  level:
    com.corporateactions: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/application.log
